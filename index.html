<title>今天的生活線索</title>

<style>
:root{
  --bg:#f3efe6;
  --paper:#fffdf8;
  --text:#302f2b;
  --muted:#77736a;
  --line:#d9d2c4;
  --accent:#75846f;
  --accent-soft:#e4e8df;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  min-height:100dvh;
  background:
    radial-gradient(circle at top left,#fbf8f1 0%,transparent 45%),
    var(--bg);
  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang TC",
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
}

button{
  font:inherit;
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:min(100%,520px);
  min-height:100dvh;
  margin:0 auto;

  padding:
    max(24px,env(safe-area-inset-top))
    22px
    max(32px,env(safe-area-inset-bottom));

  display:flex;
  flex-direction:column;
}

.brand{
  margin-bottom:24px;
  color:var(--muted);
  font-size:12px;
  letter-spacing:.18em;
}

.screen{
  flex:1;
  display:none;
  flex-direction:column;
}

.screen.active{
  display:flex;
}

/* =========================
   首頁
========================= */

.home{
  justify-content:center;
  text-align:center;
  padding-bottom:8vh;
}

.deck{
  position:relative;
  width:175px;
  height:238px;
  margin:0 auto 40px;
}

.deck-card{
  position:absolute;
  inset:0;
  background:var(--paper);

  border:
    1px solid rgba(65,63,57,.12);

  border-radius:21px;

  box-shadow:
    0 18px 45px
    rgba(57,52,44,.09);
}

.deck-card:nth-child(1){
  transform:
    rotate(-5deg)
    translate(-8px,5px);
}

.deck-card:nth-child(2){
  transform:
    rotate(4deg)
    translate(8px,2px);
}

.deck-card:nth-child(3){
  display:grid;
  place-items:center;
}

.deck-symbol{
  width:56px;
  height:56px;

  display:grid;
  place-items:center;

  color:var(--muted);

  border:
    1px solid var(--line);

  border-radius:50%;

  font-size:18px;
}

h1{
  margin:0 0 20px;

  font-family:
    Georgia,
    "Noto Serif TC",
    serif;

  font-size:
    clamp(32px,8vw,43px);

  font-weight:500;
  line-height:1.3;
}

.intro{
  max-width:330px;

  margin:
    0 auto 34px;

  color:var(--muted);

  font-size:16px;
  line-height:1.9;
}

.primary{
  min-width:190px;

  padding:
    16px 30px;

  background:var(--text);
  color:#fff;

  border:0;
  border-radius:999px;

  box-shadow:
    0 8px 20px
    rgba(48,47,43,.14);

  cursor:pointer;
  font-weight:600;
}

.primary:active{
  transform:translateY(1px);
}

/* =========================
   卡牌
========================= */

.card-screen{
  justify-content:center;
}

.today-label{
  margin-bottom:16px;

  color:var(--muted);

  font-size:12px;
  letter-spacing:.16em;

  text-align:center;
}

.card{
  position:relative;

  min-height:505px;

  padding:
    30px 26px 26px;

  background:var(--paper);

  border:
    1px solid rgba(53,50,45,.11);

  border-radius:25px;

  box-shadow:
    0 22px 60px
    rgba(55,50,43,.10);

  overflow:hidden;

  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.card.animate{
  animation:
    reveal .45s ease both;
}

@keyframes reveal{
  from{
    opacity:0;
    transform:
      translateY(16px)
      scale(.985);
  }

  to{
    opacity:1;
    transform:none;
  }
}

.card-shape{
  position:absolute;

  top:-110px;
  right:-80px;

  width:210px;
  height:210px;

  background:
    var(--accent-soft);

  border-radius:50%;

  opacity:.85;
}

.category{
  position:relative;
  z-index:1;

  display:inline-flex;
  align-items:center;

  gap:8px;

  color:var(--accent);

  font-size:12px;
  letter-spacing:.16em;
}

.category-dot{
  width:7px;
  height:7px;

  background:var(--accent);

  border-radius:50%;
}

.card-title{
  position:relative;
  z-index:1;

  max-width:88%;

  margin:
    48px 0 28px;

  font-family:
    Georgia,
    "Noto Serif TC",
    serif;

  font-size:34px;
  font-weight:500;
  line-height:1.35;
}

.blessing{
  max-width:94%;

  margin:0;

  font-family:
    Georgia,
    "Noto Serif TC",
    serif;

  font-size:18px;
  line-height:1.9;
}

.divider{
  width:34px;
  height:1px;

  margin:
    30px 0 22px;

  background:var(--line);
}

.clue-label{
  margin-bottom:11px;

  color:var(--accent);

  font-size:12px;
  font-weight:700;
  letter-spacing:.16em;
}

.clue{
  margin:0;

  color:#46443f;

  font-size:16px;
  line-height:1.85;
}

.card-footer{
  margin-top:34px;

  color:#999388;

  font-size:11px;
  letter-spacing:.06em;
}

/* =========================
   按鈕
========================= */

.save-button{
  width:100%;
  min-height:54px;

  margin-top:18px;

  padding:
    13px 18px;

  background:var(--text);
  color:#fff;

  border:
    1px solid var(--text);

  border-radius:15px;

  cursor:pointer;
  font-weight:600;
}

.secondary-actions{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;

  margin-top:10px;
}

.secondary,
.ghost{
  min-height:49px;

  padding:
    11px 10px;

  border-radius:14px;

  cursor:pointer;
}

.secondary{
  background:
    rgba(255,255,255,.45);

  color:var(--text);

  border:
    1px solid var(--line);
}

.ghost{
  background:transparent;

  color:var(--text);

  border:
    1px solid var(--line);
}

.change{
  display:block;

  margin:0 auto;

  padding:
    19px 12px 6px;

  background:transparent;

  color:var(--muted);

  border:0;

  cursor:pointer;

  font-size:13px;

  text-decoration:underline;
  text-underline-offset:4px;
}

.tiny-note{
  margin:
    17px 5px 0;

  color:#928d83;

  font-size:12px;
  line-height:1.7;

  text-align:center;
}

/* =========================
   Toast
========================= */

.toast{
  position:fixed;

  left:50%;

  bottom:
    max(
      25px,
      env(safe-area-inset-bottom)
    );

  z-index:999;

  padding:
    11px 18px;

  background:
    rgba(45,44,40,.94);

  color:#fff;

  border-radius:999px;

  font-size:13px;

  opacity:0;

  pointer-events:none;

  transform:
    translateX(-50%)
    translateY(20px);

  transition:.25s;
}

.toast.show{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}

@media(max-width:390px){

  .card{
    min-height:480px;
  }

  .card-title{
    font-size:30px;
  }

  .secondary-actions{
    grid-template-columns:1fr;
  }
}
</style>
</head>

/* =====================================================
   LocalStorage V6
===================================================== */

const STORAGE={

  DATE:
    "lifeClueDateV6",

  TODAY:
    "lifeClueTodayV6",

  HISTORY:
    "lifeClueHistoryV6"

};


/* =====================================================
   日期
===================================================== */

function getTodayKey(){

  const date=
    new Date();

  const year=
    date.getFullYear();

  const month=
    String(
      date.getMonth()+1
    ).padStart(2,"0");

  const day=
    String(
      date.getDate()
    ).padStart(2,"0");

  return `${year}-${month}-${day}`;
}


/* =====================================================
   歷史紀錄
===================================================== */

function getHistory(){

  try{

    const raw=
      localStorage.getItem(
        STORAGE.HISTORY
      );

    if(!raw){
      return [];
    }

    const data=
      JSON.parse(raw);

    return Array.isArray(data)
      ? data
      : [];

  }catch{

    return [];

  }
}


function saveHistory(id){

  let history=
    getHistory();

  history=
    history.filter(
      item=>
        Number(item)!==
        Number(id)
    );

  history.push(id);

  /*
    41 張牌時，
    保留最近 6 張避免短期重複。
  */

  history=
    history.slice(-6);

  try{

    localStorage.setItem(
      STORAGE.HISTORY,
      JSON.stringify(history)
    );

  }catch{}
}


/* =====================================================
   今天的牌
===================================================== */

function saveTodayCard(card){

  try{

    localStorage.setItem(
      STORAGE.DATE,
      getTodayKey()
    );

    localStorage.setItem(
      STORAGE.TODAY,
      String(card.id)
    );

  }catch{}
}


function getTodayCard(){

  try{

    const date=
      localStorage.getItem(
        STORAGE.DATE
      );

    const id=
      Number(
        localStorage.getItem(
          STORAGE.TODAY
        )
      );

    if(
      date!==
      getTodayKey()
    ){
      return null;
    }

    if(!id){
      return null;
    }

    return(
      cards.find(
        card=>
          card.id===id
      )||null
    );

  }catch{

    return null;

  }
}


/* =====================================================
   抽牌
===================================================== */

function randomFrom(array){

  const index=
    Math.floor(
      Math.random()*
      array.length
    );

  return array[index];
}


function pickNewCard(){

  const history=
    getHistory();

  let pool=
    cards.filter(
      card=>
        !history.includes(
          card.id
        )
    );

  if(
    pool.length===0
  ){
    pool=[...cards];
  }

  return randomFrom(pool);
}


function pickDifferentCard(){

  if(!currentCard){
    return pickNewCard();
  }

  const history=
    getHistory();

  let pool=
    cards.filter(
      card=>
        card.id!==
        currentCard.id
        &&
        !history.includes(
          card.id
        )
    );

  if(
    pool.length===0
  ){

    pool=
      cards.filter(
        card=>
          card.id!==
          currentCard.id
      );

  }

  return randomFrom(pool);
}

function drawTodayCard(){

  const saved=
    getTodayCard();

  if(saved){

    showCard(
      saved,
      true
    );

    return;
  }

  const card=
    pickNewCard();

  saveTodayCard(

}

}

/* =====================================================
   複製文字
===================================================== */

async function copyText(){

  const text=
    getShareText();

  if(!text){
    return;
  }

  try{

    await navigator
      .clipboard
      .writeText(text);

    toast(
      "文字已複製"
    );

    return;

  }catch{}


  try{

    const textarea=
      document.createElement(
        "textarea"
      );

    textarea.value=
      text;

    textarea.style.position=
      "fixed";

    textarea.style.opacity=
      "0";

    document.body
      .appendChild(
        textarea
      );

    textarea.focus();
    textarea.select();

    document.execCommand(
      "copy"
    );

    textarea.remove();

    toast(
      "文字已複製"
    );

  }catch{

    window.prompt(
      "請複製以下文字：",
      text
    );
  }
}


/* =====================================================
   Canvas 自動換行
===================================================== */

function drawWrappedText(
  ctx,
  text,
  x,
  y,
  maxWidth,
  lineHeight
){

  const chars=
    [...text];

  let line="";

  let currentY=y;

  for(
    const char of chars
  ){

    const next=
      line+char;

    if(
      ctx
        .measureText(next)
        .width
      >
      maxWidth
      &&
      line
    ){

      ctx.fillText(
        line,
        x,
        currentY
      );

      line=char;

      currentY+=
        lineHeight;

    }else{

      line=next;

    }
  }

  if(line){

    ctx.fillText(
      line,
      x,
      currentY
    );
  }

  return currentY;
}


/* =====================================================
   圓角
===================================================== */

function roundedRect(
  ctx,
  x,
  y,
  width,
  height,
  radius
){

  ctx.beginPath();

  ctx.moveTo(
    x+radius,
    y
  );

  ctx.lineTo(
    x+width-radius,
    y
  );

  ctx.quadraticCurveTo(
    x+width,
    y,
    x+width,
    y+radius
  );

  ctx.lineTo(
    x+width,
    y+height-radius
  );

  ctx.quadraticCurveTo(
    x+width,
    y+height,
    x+width-radius,
    y+height
  );

  ctx.lineTo(
    x+radius,
    y+height
  );

  ctx.quadraticCurveTo(
    x,
    y+height,
    x,
    y+height-radius
  );

  ctx.lineTo(
    x,
    y+radius
  );

  ctx.quadraticCurveTo(
    x,
    y,
    x+radius,
    y
  );

  ctx.closePath();
}


function fillRoundedRect(
  ctx,
  x,
  y,
  width,
  height,
  radius,
  fillColor
){

  ctx.save();

  ctx.fillStyle=
    fillColor;

  roundedRect(
    ctx,
    x,
    y,
    width,
    height,
    radius
  );

  ctx.fill();

  ctx.restore();
}


function drawShadowCard(
  ctx,
  x,
  y,
  width,
  height,
  radius,
  fillColor
){

  ctx.save();

  ctx.shadowColor=
    "rgba(54,49,43,.18)";

  ctx.shadowBlur=
    45;

  ctx.shadowOffsetX=
    0;

  ctx.shadowOffsetY=
    20;

  ctx.fillStyle=
    fillColor;

  roundedRect(
    ctx,
    x,
    y,
    width,
    height,
    radius
  );

  ctx.fill();

  ctx.restore();
}


/* =====================================================
   建立收藏 / 限動卡牌圖片
===================================================== */

async function createStoryBlob(){

  if(!currentCard){
    return null;
  }

  const theme=
    themes[
      currentCard.category
    ]
    ||
    themes["感覺"];


  const canvas=
    document.createElement(
      "canvas"
    );

  canvas.width=
    1080;

  canvas.height=
    1920;


  const ctx=
    canvas.getContext(
      "2d"
    );

  if(!ctx){
    return null;
  }


  /* 背景 */

  ctx.fillStyle=
    theme.background;

  ctx.fillRect(
    0,
    0,
    1080,
    1920
  );


  /* 右上光 */

  ctx.save();

  ctx.globalAlpha=
    .30;

  ctx.fillStyle=
    "#FFFFFF";

  ctx.beginPath();

  ctx.arc(
    1010,
    100,
    355,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();


  /* 左下圓 */

  ctx.save();

  ctx.globalAlpha=
    .18;

  ctx.fillStyle=
    theme.backgroundDark;

  ctx.beginPath();

  ctx.arc(
    -70,
    1780,
    340,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();


  /* 左上小點 */

  ctx.save();

  ctx.globalAlpha=
    .20;

  ctx.fillStyle=
    theme.backgroundDark;

  ctx.beginPath();

  ctx.arc(
    112,
    250,
    48,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();


  /* 右側橢圓 */

  ctx.save();

  ctx.globalAlpha=
    .08;

  ctx.fillStyle=
    theme.accent;

  ctx.beginPath();

  ctx.ellipse(
    980,
    980,
    190,
    420,
    .18,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();


  /* =====================
     卡牌主體
  ===================== */

  const cardX=120;
  const cardY=170;
  const cardW=840;
  const cardH=1460;
  const cardR=40;


  drawShadowCard(
    ctx,
    cardX,
    cardY,
    cardW,
    cardH,
    cardR,
    theme.card
  );


  /* 卡牌細框 */

  ctx.save();

  ctx.strokeStyle=
    "rgba(92,84,76,.10)";

  ctx.lineWidth=2;

  roundedRect(
    ctx,
    cardX,
    cardY,
    cardW,
    cardH,
    cardR
  );

  ctx.stroke();

  ctx.restore();


  /* 卡牌右上裝飾 */

  ctx.save();

  ctx.globalAlpha=.55;

  ctx.fillStyle=
    theme.soft;

  ctx.beginPath();

  ctx.arc(
    cardX+cardW-40,
    cardY+30,
    170,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();


  /* 內部裝飾弧線 */

  ctx.save();

  ctx.globalAlpha=.32;

  ctx.strokeStyle=
    theme.accent;

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.arc(
    cardX+cardW-120,
    cardY+140,
    50,
    0,
    Math.PI*1.3
  );

  ctx.stroke();

  ctx.restore();


  /* =====================
     文字
  ===================== */

  const innerX=
    cardX+72;

  const innerW=
    cardW-144;


  ctx.fillStyle=
    theme.accent;

  ctx.font=
    '600 24px "Microsoft JhengHei","PingFang TC",sans-serif';

  ctx.fillText(
    "TODAY'S CLUE",
    innerX,
    cardY+85
  );


  ctx.font=
    '25px "Microsoft JhengHei","PingFang TC",sans-serif';

  ctx.fillText(
    currentCard.category,
    innerX,
    cardY+135
  );


  /* 卡名 */

  ctx.fillStyle=
    "#2F2C28";

  let titleSize=
    currentCard.title.length>8
      ? 58
      : currentCard.title.length>6
      ? 64
      : 72;

  ctx.font=
    `600 ${titleSize}px "Microsoft JhengHei","PingFang TC",sans-serif`;


  const titleEnd=
    drawWrappedText(
      ctx,
      currentCard.title,
      innerX,
      cardY+300,
      innerW,
      titleSize+20
    );


  /* 祝福 */

  ctx.fillStyle=
    "#45413C";

  ctx.font=
    '36px "Microsoft JhengHei","PingFang TC",sans-serif';


  const blessingStart=
    titleEnd+100;


  const blessingEnd=
    drawWrappedText(
      ctx,
      currentCard.blessing,
      innerX,
      blessingStart,
      innerW,
      62
    );


  /* 分隔線 */

  const dividerY=
    blessingEnd+65;


  ctx.save();

  ctx.strokeStyle=
    "rgba(104,96,87,.28)";

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(
    innerX,
    dividerY
  );

  ctx.lineTo(
    innerX+76,
    dividerY
  );

  ctx.stroke();

  ctx.restore();


  /* =====================
     線索框
  ===================== */

  const clueBoxY=
    dividerY+65;

  const clueBoxH=
    310;


  fillRoundedRect(
    ctx,
    innerX,
    clueBoxY,
    innerW,
    clueBoxH,
    28,
    theme.clue
  );


  ctx.fillStyle=
    theme.accent;

  ctx.font=
    '600 27px "Microsoft JhengHei","PingFang TC",sans-serif';

  ctx.fillText(
    "今天的線索",
    innerX+34,
    clueBoxY+64
  );


  ctx.fillStyle=
    "#3F3B37";

  ctx.font=
    '33px "Microsoft JhengHei","PingFang TC",sans-serif';


  drawWrappedText(
    ctx,
    currentCard.clue,
    innerX+34,
    clueBoxY+132,
    innerW-68,
    56
  );


  /* =====================
     卡底
  ===================== */

  ctx.fillStyle=
    "#777169";

  ctx.font=
    '24px "Microsoft JhengHei","PingFang TC",sans-serif';

  ctx.fillText(
    "卡片會重複，生活不會。",
    innerX,
    cardY+cardH-105
  );


  ctx.fillStyle=
    theme.accent;

  ctx.font=
    '600 25px "Microsoft JhengHei","PingFang TC",sans-serif';

  ctx.fillText(
    "#今天的生活線索",
    innerX,
    cardY+cardH-50
  );


  /* 外部品牌 */

  ctx.save();

  ctx.globalAlpha=.55;

  ctx.fillStyle=
    theme.accent;

  ctx.font=
    '22px "Microsoft JhengHei","PingFang TC",sans-serif';

  ctx.fillText(
    "今天的生活線索",
    120,
    1815
  );

  ctx.restore();


  return await new Promise(
    resolve=>{

      canvas.toBlob(
        resolve,
        "image/png",
        1
      );

    }
  );
}


/* =====================================================
   儲存圖片
===================================================== */

async function saveStoryImage(){

  const blob=
    await createStoryBlob();

  if(!blob){

    toast(
      "圖片產生失敗"
    );

    return;
  }


  const url=
    URL.createObjectURL(
      blob
    );


  const link=
    document.createElement(
      "a"
    );


  link.href=url;


  link.download=
    currentCard
      ? `今天的生活線索-${currentCard.title}.png`
      : "今天的生活線索.png";


  document.body
    .appendChild(
      link
    );


  link.click();


  link.remove();


  setTimeout(
    ()=>{

      URL.revokeObjectURL(
        url
      );

    },
    1500
  );


  toast(
    "今天的牌已儲存"
  );
}


/* =====================================================
   手機判斷
===================================================== */

function isMobileDevice(){

  return(
    /Android|iPhone|iPad|iPod/i
      .test(
        navigator.userAgent
      )
  );
}


/* =====================================================
   分享圖片
===================================================== */

async function shareStoryImage(){

  if(
    !isMobileDevice()
  ){

    toast(
      "電腦版請先儲存圖片，再分享到 LINE 或社群"
    );

    return;
  }


  const blob=
    await createStoryBlob();


  if(!blob){

    toast(
      "圖片產生失敗"
    );

    return;
  }


  try{

    const file=
      new File(
        [blob],
        `今天的生活線索-${currentCard.title}.png`,
        {
          type:"image/png"
        }
      );


    if(
      navigator.share
      &&
      navigator.canShare
      &&
      navigator.canShare({
        files:[file]
      })
    ){

      await navigator.share({

        files:[file],

        title:
          "今天的生活線索",

        text:
          `今天的生活線索｜${currentCard.title}\n#今天的生活線索`

      });


      return;
    }

  }catch(error){

    if(
      error
      &&
      error.name==="AbortError"
    ){

      return;
    }
  }


  toast(
    "這個手機瀏覽器無法直接分享，請先儲存圖片"
  );
}


/* =====================================================
   按鈕
===================================================== */

drawBtn.addEventListener(
  "click",
  drawTodayCard
);


saveImageBtn.addEventListener(
  "click",
  saveStoryImage
);


shareImageBtn.addEventListener(
  "click",
  shareStoryImage
);


copyBtn.addEventListener(

  copyText
);


changeBtn.addEventListener(

   初始化
===================================================== */

function init(){

  const saved=
    getTodayCard();

  drawBtn.textContent=
    saved
      ? "看看今天的牌"
      : "抽一張";
}


document.addEventListener(
  "DOMContentLoaded",
  init
);
